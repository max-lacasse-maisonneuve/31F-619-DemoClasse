<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tâches</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
            integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <script src="/assets/js/pages/index.js" type="module"></script>
        <link rel="stylesheet" href="/assets/css/main.css" />
    </head>
    <body data-app>
        <header>
            <h1>Application de gestion de tâches</h1>
            <nav>
                <a href="/liste" data-lien>Liste des tâches</a>
                <a href="/ajouter" data-lien>Ajouter une tâche</a>
                <i class="fa fa-users utilisateur"></i>
            </nav>
            <nav data-action="dark-mode">
                <span class="btn fa fa-moon" data-mode="dark"></span>
                <span class="btn fa fa-sun" data-mode="light"></span>
            </nav>
        </header>

        <main>
            <section data-panneau="liste">
                <h2>Liste des tâches</h2>
                <div class="liste-taches"></div>
                <template id="tache">
                    <div class="tache" id="{{id}}">
                        <h3>{{nom}}</h3>
                        <div class="btn" data-action="supprimer"><i class="fa fa-trash"></i>Supprimer</div>
                    </div>
                </template>
            </section>

            <section data-panneau="detail">
                <h2 data-nom>{{ Tache }}</h2>
                <p data-date>{{ date }}</p>
                <p data-description>{{ description }}</p>
                <p data-est-terminee>{{ est terminée }}</p>
            </section>

            <section data-panneau="formulaire">
                <h2>Ajouter une tâche</h2>
                <form data-action="ajouter">
                    <div class="input-group">
                        <label for="nom">Nom</label>
                        <input type="text" id="nom" name="nom" required />
                    </div>
                    <div class="input-group">
                        <label for="description">Description</label>
                        <textarea type="text" id="description" name="description" required> </textarea>
                    </div>

                    <div class="input-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date" required />
                    </div>

                    <div class="input-group">
                        <label for="estTerminee">Est terminée</label>
                        <input type="checkbox" id="estTerminee" name="estTerminee" />
                    </div>
                    <button type="submit">Ajouter</button>
                </form>
            </section>

            <template id="toast-modale">
                <div class="toast-modale">
                    <div class="toast-modale-content">
                        <p class="toast-message">{{message}}</p>
                    </div>
                </div>
            </template>
        </main>
    </body>
</html>
