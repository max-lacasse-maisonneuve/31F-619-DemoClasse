<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" href="assets/img/favicon.ico" type="image/x-icon" />
        <link rel="stylesheet" href="assets/css/styles.css" />
        <script type="module" src="assets/js/pages/index.js"></script>
        <title>Appli-météo</title>
    </head>

    <body data-meteo="soleil" class="meteo">
        <header>
            <h1>Appli-météo</h1>
            <div class="buttons"></div>
        </header>
        <main data-app>
            <span class="spinner"><img src="assets/img/spinner.svg" alt="" /></span>
            <section class="meteo__icon">
                <icone-meteo data-type="soleil"></icone-meteo>
                <img src="" alt="" />
            </section>
            <section class="meteo__text">
                <p class="city"></p>
                <p class="temperature"></p>
            </section>
            <section class="error">
                <p class="error_text"></p>
            </section>
        </main>
        <template id="publicite">
            <div>
                <h3>{{ PUB_TITLE }}</h3>
                <h4>{{ PUB_DESC }}</h4>
            </div>
        </template>
        <div data-pub></div>
        <div data-footer></div>
    </body>
</html>
