<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tâches</title>
        <script src="assets/js/pages/index.js" type="module"></script>
        <link rel="stylesheet" href="assets/css/main.css" />
    </head>
    <body>
        <section data-panneau="liste">
            <h1>Liste des tâches</h1>
            <button data-action="ajouter">Ajouter une tâche</button>
        </section>

        <section data-panneau="formulaire">
            <h1>Ajouter une tâche</h1>
            <form data-action="ajouter">
                <label for="tache">Tâche</label>
                <input type="text" id="tache" name="tache" />
                <button type="submit">Ajouter</button>
            </form>
        </section>

        <template id="toast-modale">
            <div class="toast-modale">
                <div class="toast-modale-content">
                    <p class="toast-message">{{message}}</p>
                </div>
            </div>
        </template>
        <template id="tache">
            <div class="tache" id="{{id}}">
                <h2>{{tache}}</h2>
                <h3>{{estTerminee}}</h3>
            </div>
        </template>
    </body>
</html>
